<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADRIN MUSIC</title>
  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      font-family: Tahoma, Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      color: gold;
      font-size: 40px;
    }
    h2 {
      color: red;
    }
    img {
      width: 80%;
      max-width: 300px;
      border-radius: 15px;
    }
    .song {
      background-color: #222;
      padding: 15px;
      margin: 10px auto;
      border-radius: 10px;
      max-width: 320px;
    }
    .song h3 {
      margin: 0 0 10px 0;
      color: deepskyblue;
    }
    audio {
      width: 100%;
    }
    ul {
      padding: 0;
    }
    li {
      background-color: #222;
      padding: 10px;
      margin: 8px auto;
      border-radius: 10px;
      list-style: none;
      max-width: 300px;
    }
    button {
      background-color: gold;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background-color: orange;
    }
  </style>
</head>
<body>

  <h1>ADRIN MUSIC</h1>
  <img src="https://uploadkon.ir/uploads/666729_26IMG-1684.jpeg" alt="کاور آهنگ">
  <p>دسترسی به اهنگ های آدرین</p>

  <h2>آهنگ‌های ادرین</h2>

  <div class="song">
    <h3>Halakojai</h3>
    <audio controls src="https://uploadkon.ir/uploads/bf3d29_26adrin-–-hala-kojai.mp3"></audio>
  </div>

  <div class="song">
    <h3>Jadoo</h3>
    <audio controls src="https://uploadkon.ir/uploads/1d9329_26Adrin-Jadoo-320-.mp3"></audio>
  </div>

  <div class="song">
    <h3>Gereh</h3>
    <audio controls src="https://uploadkon.ir/uploads/df8c29_26Adrin-Gereh-320-.mp3"></audio>
  </div>

  <h2</h2>لینک</h2>
  <ul>
    <li><a href="https://youtube.com/@adrin-officiall">کانال یوتیوب ادرین</a></li>
    <li><a href="https://on.soundcloud.com/AvuVBPsikSGXfUCHit">ساوندکلود ادرین</a></li>
  </ul>

  <button onclick="alert('ممنون! ❤')">❤ پسندیدم</button>

</body>
</html>
